name: Setup pnpm workspace
description: Install pnpm, set up Node.js with pnpm cache, and install workspace dependencies.

inputs:
  node-version-file:
    description: File that defines the Node.js version.
    required: false
    default: .nvmrc
  install-args:
    description: Arguments passed to pnpm install.
    required: false
    default: --frozen-lockfile
  turbo-cache:
    description: Restore and save Turborepo's local task cache.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v5

    - uses: actions/setup-node@v6
      with:
        node-version-file: ${{ inputs.node-version-file }}
        cache: pnpm

    - shell: bash
      run: pnpm install ${{ inputs.install-args }}

    - name: Restore Turborepo cache
      if: ${{ inputs.turbo-cache == 'true' }}
      uses: actions/cache@v4
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-
          turbo-${{ runner.os }}-${{ github.job }}-
          turbo-${{ runner.os }}-
