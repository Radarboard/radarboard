name: Extension Catalog

on:
  push:
    branches: [main]
    paths:
      - "integrations/*/src/index.ts"
      - "plugins/*/src/index.ts"
      - "widgets/*/index.ts"
      - "radarboard.config.ts"

jobs:
  publish-catalog:
    name: Publish Extension Catalog
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate catalog JSON
        run: pnpm tsx scripts/generate-extension-catalog.ts

      - name: Replace CHANGELOG date placeholders
        run: |
          TODAY=$(date +%Y-%m-%d)
          find integrations plugins widgets -name "CHANGELOG.md" -exec sed -i "s/{PR_MERGE_DATE}/$TODAY/g" {} +

      - name: Commit catalog updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/app/public/extension-catalog.json
          git add integrations/*/CHANGELOG.md plugins/*/CHANGELOG.md widgets/*/CHANGELOG.md
          git diff --staged --quiet || git commit -m "chore: update extension catalog and changelogs"
          git push
