<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="6" fill="#101010"/>
  <!-- outer ring -->
  <circle cx="16" cy="16" r="11" stroke="#5b8af5" stroke-width="2.5" fill="none" opacity="0.3"/>
  <!-- middle ring -->
  <circle cx="16" cy="16" r="7" stroke="#5b8af5" stroke-width="2" fill="none" opacity="0.5"/>
  <!-- inner ring -->
  <circle cx="16" cy="16" r="3" stroke="#5b8af5" stroke-width="1.5" fill="none" opacity="0.7"/>
  <!-- sweep line -->
  <line x1="16" y1="16" x2="16" y2="5" stroke="#5b8af5" stroke-width="2" stroke-linecap="round"/>
  <!-- blip -->
  <circle cx="16" cy="9" r="2" fill="#4ade80"/>
</svg>
