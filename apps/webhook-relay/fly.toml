# Fly.io deployment configuration for the webhook relay.
# Deploy with: fly launch --dockerfile Dockerfile
# See: https://fly.io/docs/reference/configuration/

app = "radarboard-webhook-relay"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"
  # Fly builds from the repo root — set the Dockerfile context accordingly.
  # If deploying from the monorepo root, use:
  #   fly deploy --dockerfile apps/webhook-relay/Dockerfile

[env]
  PORT = "8787"
  NODE_ENV = "production"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
